name: shader-validate

on:
  push:
  pull_request:

concurrency:
  group: shader-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate HLSL shaders
    runs-on: windows-latest

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_CACHE_DIR: ${{ github.workspace }}/.vcpkg-cache
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite"
      VCPKG_TARGET_TRIPLET: x64-windows-static-md
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Checkout vcpkg at pinned revision
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          Push-Location $env:VCPKG_ROOT
          git checkout 4334d8b4c8916018600212ab4dd4bbdc343065d1
          Pop-Location

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_CACHE_DIR }}
          key: vcpkg-sv-${{ runner.os }}-${{ env.VCPKG_TARGET_TRIPLET }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-sv-${{ runner.os }}-${{ env.VCPKG_TARGET_TRIPLET }}-

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          if ("$env:VCPKG_CACHE_DIR" -ne "") { New-Item -ItemType Directory -Force -Path "$env:VCPKG_CACHE_DIR" | Out-Null }

      - name: Configure
        shell: pwsh
        run: |
          cmake -B build -S ${{ github.workspace }} `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="$env:VCPKG_TARGET_TRIPLET" `
            -DKIZURI_BUILD_TESTS=OFF `
            -DKIZURI_BUILD_TOOLS=ON

      - name: Build validator
        shell: pwsh
        run: |
          cmake --build build --config Release --target KizuriShaderValidator

      - name: Validate shaders
        shell: pwsh
        run: |
          & build\bin\Release\KizuriShaderValidator.exe engine/KizuriRenderer/shaders